name: Ruby CI

on: 
  workflow_call: 
  pull_request:

jobs:
  elasticsearch:

    runs-on: ${{matrix.os}}-latest

    strategy:
      matrix:
        os: ['ubuntu']
        ruby: ['3.2', '3.3']
        elasticsearch: ['7.x-SNAPSHOT', '8.12.2']

    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Increase system limits
        run: |
          sudo swapoff -a
          sudo sysctl -w vm.swappiness=1
          sudo sysctl -w fs.file-max=262144
          sudo sysctl -w vm.max_map_count=262144
      - name: Set up Elasticsearch ${{ matrix.elasticsearch }}
        uses: elastic/elastic-github-actions/elasticsearch@master
        with:
          stack-version: ${{matrix.elasticsearch}}
          security-enabled: false
      - name: Install dependencies
        run: bundle install
      - name: Run tests
        run: bundle exec rspec

  opensearch:
  
      runs-on: ${{matrix.os}}-latest

      strategy:
        matrix:
          os: ['ubuntu']
          ruby: ['3.2', '3.3']
          opensearch: ['2.19.7', '3.9.0']

      env:
        BACKEND: opensearch
        OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        DISABLE_INSTALL_DEMO_CONFIG: true

      steps:
        - uses: actions/checkout@v4
        - name: Set up OpenSearch ${{ matrix.opensearch }}
          uses: theablefew/opensearch-github-actions/opensearch@main
          with:
            version: ${{ matrix.opensearch }}
            security-disabled: true

        - name: Set up Ruby ${{ matrix.ruby }}
          uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
          with:
            ruby-version: ${{ matrix.ruby }}

        - name: Install dependencies
          run: bundle install
        - name: Run tests
          run: bundle exec rspec --tag ~type:integration